# Genera la licencia (o una llave de rescate de PIN) para un negocio.
# Actions → Generar licencia → Run workflow, llena los datos y abre el resultado.
# La clave queda en el resumen de la ejecución; solo sirve en el equipo cuyo código pusiste.
name: Generar licencia

on:
  workflow_dispatch:
    inputs:
      negocio:
        description: Nombre del negocio
        required: true
      equipo:
        description: Código del equipo (sale en Ajustes → Licencia, ej. K7F2-9QXA)
        required: true
      meses:
        description: ¿Por cuánto tiempo?
        type: choice
        options: ['1', '3', '6', '12', 'Sin vencimiento']
        default: '1'
      tipo:
        description: ¿Qué generar?
        type: choice
        options: [licencia, rescate]
        default: licencia

permissions:
  contents: read

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generar
        env:
          LICENCIA_LLAVE_PRIVADA: ${{ secrets.LICENCIA_LLAVE_PRIVADA }}
          TIPO: ${{ inputs.tipo }}
          NEGOCIO: ${{ inputs.negocio }}
          EQUIPO: ${{ inputs.equipo }}
          MESES: ${{ inputs.meses }}
        run: |
          [ "$MESES" = "Sin vencimiento" ] && MESES=0
          node herramientas/licencia.mjs "$TIPO" "$NEGOCIO" "$EQUIPO" "$MESES"
