# Construye el instalador de Windows.
# - Cada merge a main publica solo la versión siguiente (v1.0.1 → v1.0.2…) en Releases
#   con el .exe y latest.yml, y las apps instaladas se actualizan solas desde ahí.
#   Los cambios que solo tocan archivos .md no sacan versión.
# - También se puede publicar una versión a mano creando una Release con etiqueta v*.
# - En los PR y al correrlo a mano (Actions → Instalador de escritorio → Run workflow)
#   solo construye y deja el .exe en "Artifacts".
name: Instalador de escritorio

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths: ['electron/**', 'package.json', 'package-lock.json', '.github/workflows/escritorio.yml']

permissions:
  contents: write

concurrency:
  group: instalador-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Calcular versión
        id: version
        shell: bash
        run: |
          publicar=false
          version=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            publicar=true
            version="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if git tag --points-at HEAD | grep -q '^v'; then
              echo "Este commit ya tiene versión publicada; no se saca otra."
            else
              ultima=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
              ultima="${ultima#v}"
              [ -z "$ultima" ] && ultima="1.0.0"
              IFS=. read -r mayor menor parche <<< "$ultima"
              version="$mayor.$menor.$((parche + 1))"
              publicar=true
            fi
          fi
          echo "publicar=$publicar" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publicar: $publicar ${version:+(v$version)}"
      - name: Poner la versión
        if: steps.version.outputs.publicar == 'true'
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${{ steps.version.outputs.version }}"
      - name: Construir
        if: steps.version.outputs.publicar != 'true'
        run: npm run instalador
      # Se sube como borrador y se publica hasta que ya están el .exe y el latest.yml,
      # para que las apps nunca encuentren una versión a medio subir.
      # Si la Release ya existe (creada a mano con su etiqueta), se sube directo a ella.
      - name: Construir y subir a Releases
        if: steps.version.outputs.publicar == 'true'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npm run publicar -- -c.publish.releaseType=release
          else
            npm run publicar
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar la versión
        if: steps.version.outputs.publicar == 'true' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: gh release edit "v${{ steps.version.outputs.version }}" --draft=false --latest --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/*.exe
